server {
    server_name deeppixel.online www.deeppixel.online;

    # 1. JELLYSEERR (İstek Paneli)
    location /request {
        rewrite ^/request$ /request/ permanent;
    }

    location /request/ {
        proxy_pass http://127.0.0.1:5055/; # Sondaki eğik çizgi kalmalı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";	
		proxy_redirect http:// https://;
		proxy_redirect / /request/;
    }

    # 2. PLEX
    location /plex {
        return 302 $scheme://$host/plex/;
    }

    location /plex/ {
        proxy_pass http://127.0.0.1:32400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Plex Özel Headerlar
        proxy_set_header X-Plex-Client-Identifier $http_x_plex_client_identifier;
        proxy_set_header X-Plex-Device $http_x_plex_device;
        proxy_set_header X-Plex-Device-Name $http_x_plex_device_name;
        proxy_set_header X-Plex-Platform $http_x_plex_platform;
        proxy_set_header X-Plex-Platform-Version $http_x_plex_platform_version;
        proxy_set_header X-Plex-Product $http_x_plex_product;
        proxy_set_header X-Plex-Token $http_x_plex_token;
        proxy_set_header X-Plex-Version $http_x_plex_version;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. JELLYFIN
    location /jellyfin {
        return 302 $scheme://$host/jellyfin/;
    }

    location /jellyfin/ {
        proxy_pass http://127.0.0.1:8096; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# WIKIPEDIA (Self-hosted Wiki)
    location /wikipedia {
        return 302 $scheme://$host/wikipedia/;
    }

    location /wikipedia/ {
        proxy_pass http://127.0.0.1:9454/; # Senin Wikipedia portun
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Bazı wiki uygulamaları için gerekebilir
		proxy_redirect http://127.0.0.1:9454/ /wikipedia/;
		proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
    }

    # 4. NAVIDROME (Müzik)
    location /music {
        return 302 $scheme://$host/music/;
    }

    location /music/ {
        proxy_pass http://127.0.0.1:4533/music/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. MONOPOLY GAME
    location /game {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400;
    }

    # 5.5. MUSIC BOT DASHBOARD
    location = /musicbot {
        return 301 $scheme://$http_host/musicbot/$is_args$args;
    }

    location /musicbot/ {
        proxy_pass http://127.0.0.1:8722/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }


    # 6. ANA SAYFA: DASHBOARD (Homepage) - En sonda olmalı
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSL AYARLARI ---
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deeppixel.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deeppixel.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP'den HTTPS'e Yönlendirme
server {
    if ($host = www.deeppixel.online) {
        return 301 https://$host$request_uri;
    }
    if ($host = deeppixel.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name deeppixel.online www.deeppixel.online;
    return 404; 
}
