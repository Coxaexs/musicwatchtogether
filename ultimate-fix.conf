    server_name plex.deeppixel.online;
    ssl_certificate /etc/letsencrypt/live/plex.deeppixel.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plex.deeppixel.online/privkey.pem; # managed by Certbot


    location / {
        proxy_pass http://127.0.0.1:32400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Plex WebSockets ve Streaming Ayarları
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Plex'in beklediği özel headerlar (Çakışmaları önler)
        proxy_set_header X-Plex-Client-Identifier $http_x_plex_client_identifier;
        proxy_set_header X-Plex-Device $http_x_plex_device;
        proxy_set_header X-Plex-Device-Name $http_x_plex_device_name;
        proxy_set_header X-Plex-Platform $http_x_plex_platform;
        proxy_set_header X-Plex-Platform-Version $http_x_plex_platform_version;
        proxy_set_header X-Plex-Product $http_x_plex_product;
        proxy_set_header X-Plex-Token $http_x_plex_token;
        proxy_set_header X-Plex-Version $http_x_plex_version;
    }

}
