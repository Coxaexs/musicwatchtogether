<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - DeepPixel Watch Together</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .header {
            background: #0a0a0a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header .video-title {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .video-container {
            flex: 1;
            background: #0a0a0a;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #1a1a1a;
        }

        #player {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: #000;
            object-fit: contain;
        }

        .sidebar {
            width: 300px;
            background: #0a0a0a;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }

        .info-box h3 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .info-box p {
            opacity: 0.8;
            line-height: 1.6;
        }

        .viewers-list {
            list-style: none;
            margin-top: 10px;
        }

        .viewers-list li {
            padding: 8px;
            background: #0a0a0a;
            margin-bottom: 5px;
            border-radius: 5px;
            border: 1px solid #2a2a2a;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-disconnected {
            background: #ef4444;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            max-height: 300px;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 5px;
            font-size: 0.9em;
            border: 1px solid #2a2a2a;
        }

        .chat-message.system {
            background: #1a2a3a;
            font-style: italic;
            border: 1px solid #2a3a4a;
        }

        .copy-link-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
        }

        .copy-link-btn:hover {
            transform: translateY(-2px);
            background: #3a3a3a;
        }

        .copy-link-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }

        .floating-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .floating-notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DeepPixel Watch Together</h1>
        <div class="video-title">{{ title }}</div>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="video-container">
                <video id="player" controls controlsList="nodownload">
                    <source src="/api/video/{{ room_id }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="sidebar">
                <div class="info-box">
                    <h3>
                        <span class="status-indicator" id="connectionStatus"></span>
                        Connection Status
                    </h3>
                    <p id="statusText">Connecting...</p>
                </div>

                <div class="info-box">
                    <h3>Viewers (<span id="viewerCount">0</span>)</h3>
                    <ul class="viewers-list" id="viewersList">
                        <li>Loading...</li>
                    </ul>
                </div>

                <button class="copy-link-btn" onclick="copyLink()">
                    Copy Watch Link
                </button>

                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-message system">
                            Welcome! Video controls are synced for everyone.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-notification" id="notification">
        <span id="notificationText"></span>
    </div>

    <script>
        const roomId = "{{ room_id }}";
        let player;
        let socket;
        let isSyncing = false;
        let username = prompt("Enter your name:", "Anonymous") || "Anonymous";

        // Get HTML5 video player
        player = document.getElementById('player');

        // Initialize socket when player is ready
        player.addEventListener('loadedmetadata', () => {
            console.log("Player ready!");
            initSocket();
        });

        // Video event listeners
        player.addEventListener('play', () => {
            if (isSyncing) return;
            const currentTime = player.currentTime;
            socket.emit('play', { room_id: roomId, currentTime: currentTime });
            addChatMessage(`${username} resumed the video`, true);
        });

        player.addEventListener('pause', () => {
            if (isSyncing) return;
            const currentTime = player.currentTime;
            socket.emit('pause', { room_id: roomId, currentTime: currentTime });
            addChatMessage(`${username} paused the video`, true);
        });

        player.addEventListener('seeked', () => {
            if (isSyncing) return;
            const currentTime = player.currentTime;
            socket.emit('seek', { room_id: roomId, currentTime: currentTime });
        });

        // Initialize Socket.IO
        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                console.log("Connected to server");
                updateConnectionStatus(true);
                socket.emit('join', { room_id: roomId, username: username });
            });

            socket.on('disconnect', () => {
                console.log("Disconnected from server");
                updateConnectionStatus(false);
            });

            socket.on('sync_state', (state) => {
                console.log("Syncing state:", state);
                isSyncing = true;
                player.currentTime = state.currentTime;
                if (state.playing) {
                    player.play().catch(e => console.log('Play failed:', e));
                } else {
                    player.pause();
                }
                setTimeout(() => { isSyncing = false; }, 1000);
            });

            socket.on('play', (data) => {
                console.log("Play event received");
                isSyncing = true;
                player.currentTime = data.currentTime;
                player.play().catch(e => console.log('Play failed:', e));
                setTimeout(() => { isSyncing = false; }, 1000);
            });

            socket.on('pause', (data) => {
                console.log("Pause event received");
                isSyncing = true;
                player.currentTime = data.currentTime;
                player.pause();
                setTimeout(() => { isSyncing = false; }, 1000);
            });

            socket.on('seek', (data) => {
                console.log("Seek event received");
                isSyncing = true;
                player.currentTime = data.currentTime;
                setTimeout(() => { isSyncing = false; }, 1000);
            });

            socket.on('user_joined', (data) => {
                showNotification(`${data.username} joined`);
                addChatMessage(`${data.username} joined the watch party`, true);
                updateViewerCount(data.viewers);
            });

            socket.on('user_left', (data) => {
                showNotification(`${data.username} left`);
                addChatMessage(`${data.username} left the watch party`, true);
                updateViewerCount(data.viewers);
            });

            socket.on('cleanup_warning', (data) => {
                // Show warning dialog
                const result = confirm(data.message + '\n\nDevam etmek istiyor musunuz?');
                if (result) {
                    socket.emit('keep_session_alive', { room_id: roomId });
                    showNotification('Oturum devam ediyor');
                } else {
                    socket.emit('close_session_now', { room_id: roomId });
                }
            });

            socket.on('session_kept_alive', () => {
                addChatMessage('Oturum canlı tutuldu', true);
            });

            socket.on('session_closed', (data) => {
                alert(data.message || 'Oturum kapatıldı');
                window.close();
            });
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            const text = document.getElementById('statusText');
            
            if (connected) {
                status.className = 'status-indicator status-connected';
                text.textContent = 'Connected';
            } else {
                status.className = 'status-indicator status-disconnected';
                text.textContent = 'Disconnected';
            }
        }

        function updateViewerCount(count) {
            document.getElementById('viewerCount').textContent = count;
        }

        function addChatMessage(message, isSystem = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message' + (isSystem ? ' system' : '');
            messageDiv.textContent = message;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showNotification(text) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            notificationText.textContent = text;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function copyLink() {
            const link = window.location.href;
            navigator.clipboard.writeText(link).then(() => {
                showNotification('Link copied to clipboard!');
            }).catch(() => {
                showNotification('Failed to copy link');
            });
        }

        // Periodic sync check (every 5 seconds)
        setInterval(() => {
            if (socket && socket.connected) {
                socket.emit('request_sync', { room_id: roomId });
            }
        }, 5000);

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.emit('leave', { room_id: roomId, username: username });
            }
        });
    </script>
</body>
</html>
