[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with correctness checks across the legacy codebase. Formatting and
# broader style rules can be enabled module-by-module as files are extracted.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
